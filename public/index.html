<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToDo App — управление задачами</title>
<style>
:root{
  --bg:#f4f5f9;
  --surface:#ffffff;
  --surface-2:#f8f9fc;
  --surface-hover:#f1f3f8;
  --border:#e4e7ef;
  --border-strong:#d2d8e4;
  --text:#14172a;
  --text-2:#3a4055;
  --muted:#6a7180;
  --muted-2:#98a0b1;
  --accent:#5b5fef;
  --accent-hover:#4b4fdf;
  --accent-soft:#eef0ff;
  --accent-border:#d6d9ff;
  --success:#10b981;
  --success-hover:#0ea473;
  --success-soft:#e8faf2;
  --warning:#f59e0b;
  --warning-soft:#fef4e0;
  --danger:#ef4444;
  --danger-hover:#dc2626;
  --danger-soft:#fdecec;
  --overlay:rgba(15,18,34,.42);
  --radius:14px;
  --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 4px 16px -8px rgba(16,24,40,.14), 0 2px 4px -2px rgba(16,24,40,.05);
  --shadow-lg:0 24px 60px -22px rgba(16,24,40,.30), 0 6px 18px -8px rgba(16,24,40,.10);
  --ring:0 0 0 3px rgba(91,95,239,.18);
}

html[data-theme="dark"]{
  --bg:#0d1020;
  --surface:#161a2e;
  --surface-2:#1c2138;
  --surface-hover:#232845;
  --border:#262b43;
  --border-strong:#363d59;
  --text:#e9ebf4;
  --text-2:#c7cce0;
  --muted:#9299ad;
  --muted-2:#6b7288;
  --accent:#7a7eff;
  --accent-hover:#8b8eff;
  --accent-soft:#1e2246;
  --accent-border:#31376b;
  --success:#34d399;
  --success-hover:#22c98d;
  --success-soft:#133027;
  --warning:#fbbf24;
  --warning-soft:#3a2c11;
  --danger:#f87171;
  --danger-hover:#ef4444;
  --danger-soft:#3a1a1c;
  --overlay:rgba(3,5,14,.65);
  --shadow-sm:0 1px 2px rgba(0,0,0,.25);
  --shadow:0 4px 16px -8px rgba(0,0,0,.5), 0 2px 4px -2px rgba(0,0,0,.3);
  --shadow-lg:0 24px 60px -22px rgba(0,0,0,.65), 0 6px 18px -8px rgba(0,0,0,.4);
  --ring:0 0 0 3px rgba(122,126,255,.28);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  letter-spacing:-.005em;
  transition:background .2s ease,color .2s ease;
}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted-2);background-clip:padding-box;border:2px solid transparent}

/* ================= Topbar ================= */
.topbar{
  height:68px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;position:sticky;top:0;z-index:50;
  transition:background .2s ease,border-color .2s ease;
}
.brand{display:flex;align-items:center;gap:13px}
.logo{
  width:40px;height:40px;border-radius:11px;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;
}
.brand-name{font-weight:700;font-size:15.5px;letter-spacing:-.015em}
.brand-sub{font-size:12px;color:var(--muted)}
.topbar-right{display:flex;align-items:center;gap:18px}

.conn{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--muted-2);flex:none}
.conn.online .conn-dot{background:var(--success);box-shadow:0 0 0 3px var(--success-soft)}
.conn.offline .conn-dot{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.conn.demo .conn-dot{background:var(--warning);box-shadow:0 0 0 3px var(--warning-soft)}

/* theme toggle */
.theme-toggle{
  width:38px;height:38px;border-radius:10px;
  border:1px solid var(--border);background:var(--surface);
  color:var(--muted);cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s,border-color .15s;
}
.theme-toggle:hover{background:var(--surface-hover);color:var(--text);border-color:var(--border-strong)}
.theme-toggle .icon-sun{display:none}
.theme-toggle .icon-moon{display:block}
html[data-theme="dark"] .theme-toggle .icon-sun{display:block}
html[data-theme="dark"] .theme-toggle .icon-moon{display:none}

.switch{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;font-size:13px;color:var(--muted);font-weight:500}
.switch input{display:none}
.switch-track{
  width:40px;height:23px;border-radius:20px;background:var(--border-strong);position:relative;
  transition:background .2s;flex:none;
}
.switch-thumb{
  position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
  background:#fff;transition:transform .22s cubic-bezier(.3,1.4,.5,1);
  box-shadow:0 1px 3px rgba(16,24,40,.25);
}
.switch input:checked + .switch-track{background:var(--warning)}
.switch input:checked + .switch-track .switch-thumb{transform:translateX(17px)}

/* ================= Layout ================= */
.app{display:flex;align-items:flex-start;min-height:calc(100vh - 68px)}
.nav{
  width:240px;flex:none;padding:22px 16px;position:sticky;top:68px;
  height:calc(100vh - 68px);
}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:11px;
  color:var(--text-2);text-decoration:none;font-size:14.5px;font-weight:550;
  margin-bottom:4px;transition:background .15s,color .15s;
  letter-spacing:-.01em;
}
.nav-item svg{flex:none;opacity:.75}
.nav-item:hover{background:var(--surface-hover);color:var(--text)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item.active svg{opacity:1}
.nav-section{font-size:11px;text-transform:uppercase;letter-spacing:.1em;
             color:var(--muted-2);font-weight:700;padding:16px 14px 8px}

main{flex:1;min-width:0;padding:32px 40px 100px;max-width:1160px;margin:0 auto;width:100%}

/* ================= View header ================= */
.view-head{display:flex;align-items:flex-end;justify-content:space-between;
           gap:20px;flex-wrap:wrap;margin-bottom:24px}
.view-head h1{margin:0 0 6px;font-size:27px;letter-spacing:-.028em;font-weight:700}
.view-head p{margin:0;color:var(--muted);font-size:14px}

/* ================= Buttons ================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 16px;border-radius:10px;border:1px solid var(--border-strong);
  background:var(--surface);color:var(--text);font-size:13.5px;font-weight:600;
  cursor:pointer;transition:background .15s,border-color .15s,color .15s,box-shadow .15s;
  white-space:nowrap;line-height:1.2;letter-spacing:-.01em;
}
.btn:hover{background:var(--surface-hover);border-color:var(--muted-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger:hover{background:var(--danger-hover);border-color:var(--danger-hover)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 10px}
.btn-ghost:hover{background:var(--surface-hover);color:var(--accent);border-color:transparent}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn svg{flex:none}

/* ================= Inputs ================= */
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;letter-spacing:-.005em}
.field .hint{font-size:12px;color:var(--muted);font-weight:400;margin-top:6px}
.input,.select,.textarea{
  width:100%;padding:10px 13px;border:1px solid var(--border-strong);
  border-radius:10px;background:var(--surface-2);color:var(--text);
  outline:none;transition:border-color .15s,box-shadow .15s,background .15s;
}
.input::placeholder,.textarea::placeholder{color:var(--muted-2)}
.input:focus,.select:focus,.textarea:focus{
  border-color:var(--accent);box-shadow:var(--ring);background:var(--surface);
}
.input:disabled,.select:disabled,.textarea:disabled{
  background:var(--surface-hover);color:var(--muted-2);cursor:not-allowed;
}
.textarea{resize:vertical;min-height:88px;line-height:1.55}
.input.error,.textarea.error{border-color:var(--danger);box-shadow:0 0 0 3px rgba(239,68,68,.15)}

/* ================= Segmented (three-state) ================= */
.segmented{
  display:inline-flex;background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;padding:3px;gap:2px;margin-bottom:10px;
}
.segmented button{
  border:0;background:transparent;padding:6px 14px;border-radius:7px;
  font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;
  transition:background .15s,color .15s;letter-spacing:-.005em;
}
.segmented button:hover{color:var(--text)}
.segmented button.active{
  background:var(--accent);color:#fff;
}

/* ================= Toolbar ================= */
.toolbar{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;padding:12px 14px;
}
.toolbar .grow{flex:1;min-width:180px}
.search-wrap{position:relative;flex:1;min-width:220px}
.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);
                 color:var(--muted-2);pointer-events:none;transition:color .15s}
.search-wrap:focus-within svg{color:var(--accent)}
.search-wrap .input{padding-left:38px;background:var(--surface-2)}
.filter-label{font-size:13px;color:var(--muted);white-space:nowrap;font-weight:500}

/* ================= Cards list ================= */
.list{display:flex;flex-direction:column;gap:11px}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;transition:border-color .15s,box-shadow .15s;
}
.card:hover{border-color:var(--border-strong);box-shadow:var(--shadow)}

/* ---- User card ---- */
.user-card{display:flex;align-items:center;gap:16px}
.avatar{
  width:46px;height:46px;border-radius:12px;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:15px;letter-spacing:.02em;
}
.user-main{flex:1;min-width:0}
.user-name{font-weight:600;font-size:15.5px;margin-bottom:3px;letter-spacing:-.01em;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-meta{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.user-meta .sep{color:var(--border-strong)}
.user-actions{display:flex;gap:6px;flex:none}

/* ---- Task card ---- */
.task-card{display:flex;gap:14px;align-items:flex-start}
.check{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--border-strong);
  background:transparent;cursor:pointer;flex:none;margin-top:1px;
  display:flex;align-items:center;justify-content:center;transition:all .15s;padding:0;
}
.check:hover{border-color:var(--accent);background:var(--accent-soft)}
.check svg{opacity:0;transition:opacity .15s;color:#fff}
.check.done{background:var(--success);border-color:var(--success)}
.check.done:hover{background:var(--success-hover);border-color:var(--success-hover)}
.check.done svg{opacity:1}
.task-main{flex:1;min-width:0}
.task-title{font-weight:600;font-size:15.5px;margin-bottom:3px;word-break:break-word;letter-spacing:-.012em}
.task-card.done .task-title{text-decoration:line-through;color:var(--muted-2);font-weight:500}
.task-desc{font-size:13.5px;color:var(--muted);margin-bottom:9px;word-break:break-word;white-space:pre-wrap}
.task-card.done .task-desc{color:var(--muted-2)}
.task-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted-2);align-items:center}
.task-meta .tag{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--accent-soft);
  padding:4px 10px;border-radius:20px;font-size:12px;color:var(--accent);font-weight:600;
  border:1px solid var(--accent-border);
}
.task-actions{display:flex;gap:4px;flex:none}

/* ================= Stats ================= */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;position:relative;
}
.stat-icon{
  width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  margin-bottom:16px;
}
.stat-icon.i-created{background:var(--accent-soft);color:var(--accent)}
.stat-icon.i-done{background:var(--success-soft);color:var(--success)}
.stat-icon.i-time{background:var(--warning-soft);color:var(--warning)}
.stat-label{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:8px;letter-spacing:-.005em}
.stat-value{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.1;color:var(--text)}
.stat-value small{font-size:16px;font-weight:600;color:var(--muted);margin-left:2px}
.stat-sub{font-size:12.5px;color:var(--muted-2);margin-top:8px}

.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{width:84px;height:84px;flex:none;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .bg{stroke:var(--border)}
.ring .fg{stroke:var(--accent);transition:stroke-dasharray .6s ease}

/* ================= Empty / Loading / Error ================= */
.state{
  text-align:center;padding:60px 24px;color:var(--muted);
  background:var(--surface);
  border:1px dashed var(--border-strong);border-radius:var(--radius);
}
.state .ico{
  width:60px;height:60px;border-radius:16px;background:var(--surface-2);color:var(--muted-2);
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
}
.state h3{margin:0 0 6px;font-size:16px;color:var(--text);font-weight:600;letter-spacing:-.015em}
.state p{margin:0 0 20px;font-size:14px}
.state.error{border-style:solid;border-color:var(--danger);background:var(--danger-soft)}
.state.error .ico{background:var(--danger-soft);color:var(--danger)}
.state.error h3{color:var(--danger)}

.spinner{
  width:20px;height:20px;border:2.5px solid var(--border);
  border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block;
}
.spinner.lg{width:34px;height:34px;border-width:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-box{display:flex;align-items:center;justify-content:center;gap:14px;
             padding:60px;color:var(--muted);font-size:14px}

/* ================= Pagination ================= */
.pagination{display:flex;align-items:center;justify-content:space-between;
            gap:14px;margin-top:20px;flex-wrap:wrap;
            padding:14px 18px;
            background:var(--surface);
            border:1px solid var(--border);border-radius:14px}
.pagination .info{font-size:13px;color:var(--muted);font-weight:500}
.pagination .controls{display:flex;gap:8px;align-items:center}
.page-size{padding:8px 11px;border:1px solid var(--border-strong);border-radius:9px;
           background:var(--surface-2);color:var(--text);font-size:13px;cursor:pointer;font-weight:500;
           transition:border-color .15s}
.page-size:hover{border-color:var(--accent)}

/* ================= Modal ================= */
.overlay{
  position:fixed;inset:0;background:var(--overlay);
  display:flex;align-items:flex-start;justify-content:center;padding:48px 20px;
  z-index:100;overflow-y:auto;
  opacity:0;transition:opacity .2s;
}
.overlay.show{opacity:1}
.modal{
  background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);
  width:100%;max-width:540px;margin:auto;
  transform:translateY(16px) scale(.97);
  transition:transform .24s cubic-bezier(.2,.9,.3,1.15);
  border:1px solid var(--border);
  overflow:hidden;
}
.overlay.show .modal{transform:none}
.modal-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:24px 26px 8px;
}
.modal-head h2{margin:0;font-size:19px;letter-spacing:-.02em;font-weight:700}
.modal-head p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.modal-close{
  border:0;background:transparent;color:var(--muted-2);cursor:pointer;padding:7px;
  border-radius:9px;line-height:0;flex:none;transition:background .14s,color .14s;
}
.modal-close:hover{background:var(--surface-hover);color:var(--text)}
.modal-body{padding:20px 26px 10px;max-height:min(60vh,560px);overflow-y:auto}
.modal-foot{
  display:flex;justify-content:flex-end;gap:10px;padding:18px 26px 22px;
  border-top:1px solid var(--border);margin-top:8px;
}
.form-error{
  background:var(--danger-soft);border:1px solid var(--danger);color:var(--danger);
  border-radius:10px;padding:11px 14px;font-size:13.5px;margin-bottom:18px;
  display:none;font-weight:500;
}
.form-error.show{display:block}

/* ================= Toast ================= */
#toast-root{position:fixed;bottom:24px;right:24px;z-index:200;
            display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{
  background:#1c2138;color:#fff;padding:13px 18px;border-radius:12px;font-size:13.5px;
  box-shadow:var(--shadow-lg);max-width:380px;font-weight:500;
  display:flex;align-items:center;gap:10px;
  transform:translateX(24px);opacity:0;
  transition:transform .24s cubic-bezier(.2,.9,.3,1.15), opacity .2s;
  border:1px solid rgba(255,255,255,.06);
}
html[data-theme="dark"] .toast{background:#262b45}
.toast.show{transform:none;opacity:1}
.toast.success{background:#047857}
.toast.error{background:#b91c1c}
.toast svg{flex:none}

@media(max-width:900px){
  .app{flex-direction:column}
  .nav{width:100%;height:auto;position:static;padding:12px 16px;
       display:flex;gap:6px;border-bottom:1px solid var(--border);overflow-x:auto}
  .nav-section{display:none}
  .nav-item{margin:0;white-space:nowrap;font-size:13.5px;padding:9px 12px}
  main{padding:22px 16px 80px}
  .topbar{padding:0 16px}
  .brand-sub{display:none}
  .toolbar{padding:10px}
  .view-head h1{font-size:23px}
  .conn{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">✓</div>
    <div>
      <div class="brand-name">ToDo App</div>
      <div class="brand-sub">Управление задачами</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="conn" id="conn">
      <span class="conn-dot"></span>
      <span class="conn-text">Проверка соединения…</span>
    </div>
    <label class="switch" title="Работать без реального сервера, на встроенных данных">
      <input type="checkbox" id="demo-toggle">
      <span class="switch-track"><span class="switch-thumb"></span></span>
      <span>Демо-режим</span>
    </label>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Переключить тему" title="Светлая / тёмная тема">
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>
</header>

<div class="app">
  <aside class="nav">
    <div class="nav-section">Работа</div>
    <a class="nav-item" data-route="tasks" href="#/tasks">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Задачи

/* --- Тема --- */

    theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches

  }
  document.documentElement.setAttribute("data-theme", theme);
})();

themeToggle.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") || "light";
  const next = cur === "dark" ? "light" : "dark";

/* ============================================================
   1. Утилиты
   ============================================================ */
const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function fmtDate(iso) {
  if (!iso || iso === "null") return "—";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "short", year: "numeric" }) +
         ", " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
}

function fmtDuration(s) {
  if (!s || s === "null" || s === "0s") return "—";
  const m = String(s).match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+(?:\.\d+)?)s)?$/);
  if (!m || (!m[1] && !m[2] && !m[3])) return String(s);
  const h = +(m[1] || 0), mi = +(m[2] || 0), se = +(m[3] || 0);
  const parts = [];
  if (h) parts.push(h + " ч");
  if (mi) parts.push(mi + " мин");
  if (se || !parts.length) parts.push(Math.round(se) + " с");
  return parts.join(" ");
}

function initials(name) {
  if (!name) return "?";
  return String(name).trim().split(/\s+/).slice(0, 2)
    .map(w => w[0] || "").join("").toUpperCase() || "?";
}

/* Плоские (без градиентов) цвета аватаров */
const AVATAR_COLORS = [
  "#5b5fef","#8b5cf6","#ec4899","#f59e0b",
  "#10b981","#06b6d4","#ef4444","#84cc16"
];
function avatarColor(id) { return AVATAR_COLORS[Math.abs(+id || 0) % AVATAR_COLORS.length]; }

function plural(n, one, few, many) {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return one;
  if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return few;
  return many;
}

function debounce(fn, ms) {
  let t; return function (...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms); };
}

/* ============================================================
   2. Тосты
   ============================================================ */
const toastRoot = document.getElementById("toast-root");
function toast(message, type) {
  const el = document.createElement("div");
  el.className = "toast " + (type || "");
  const icon = type === "success"
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
    : type === "error"
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
  el.innerHTML = icon + "<span>" + esc(message) + "</span>";
  toastRoot.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 260);
  }, 3600);
}

/* ============================================================
   3. Модальные окна
   ============================================================ */
const modalRoot = document.getElementById("modal-root");

function openModal(opts) {
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true">' +
      '<div class="modal-head">' +
        '<div>' +
          '<h2>' + esc(opts.title || "") + "</h2>" +
          (opts.subtitle ? "<p>" + esc(opts.subtitle) + "</p>" : "") +
        "</div>" +
        '<button class="modal-close" type="button" aria-label="Закрыть">' +
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
        "</button>" +
      "</div>" +
      '<div class="modal-body">' + (opts.bodyHTML || "") + "</div>" +
      (opts.footHTML ? '<div class="modal-foot">' + opts.footHTML + "</div>" : "") +
    "</div>";

  modalRoot.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add("show"));

  function close() {
    overlay.classList.remove("show");
    document.removeEventListener("keydown", onKey);
    setTimeout(() => overlay.remove(), 220);
  }
  function onKey(e) { if (e.key === "Escape") close(); }
  document.addEventListener("keydown", onKey);

  $(".modal-close", overlay).addEventListener("click", close);
  overlay.addEventListener("mousedown", (e) => { if (e.target === overlay) close(); });

  if (opts.onMount) opts.onMount(overlay, close);
  return { el: overlay, close };
}

function confirmDialog(title, text, confirmLabel, onConfirm) {
  return openModal({
    title: title,
    bodyHTML: '<p style="margin:0;color:var(--text-2);font-size:14.5px">' + esc(text) + "</p>",
    footHTML:
      '<button class="btn" data-act="cancel" type="button">Отмена</button>' +
      '<button class="btn btn-danger" data-act="ok" type="button">' + esc(confirmLabel) + "</button>",
    onMount: (el, close) => {
      $('[data-act="cancel"]', el).addEventListener("click", close);
      $('[data-act="ok"]', el).addEventListener("click", () => {
        close();
        onConfirm();
      });
    }
  });
}

/* ============================================================
   4. Три-стейт сегмент-контрол
   ============================================================ */
function segmentedHTML(field, options, defaultMode) {
  return '<div class="segmented" data-field="' + esc(field) + '" data-mode="' + esc(defaultMode) + '">' +
    options.map(o =>
      '<button type="button" data-mode="' + esc(o.value) + '"' +
      (o.value === defaultMode ? ' class="active"' : "") + ">" + esc(o.label) + "</button>"
    ).join("") +
    "</div>";
}

function bindSegmented(container) {
  container.addEventListener("click", (e) => {
    const btn = e.target.closest(".segmented button");
    if (!btn) return;
    const seg = btn.parentElement;
    $$("button", seg).forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    seg.dataset.mode = btn.dataset.mode;

    const field = seg.dataset.field;
    const input = container.querySelector('[data-input="' + field + '"]');
    if (input) {
      const mode = btn.dataset.mode;
      input.disabled = (mode !== "set");
      if (mode !== "set") input.classList.remove("error");
    }
    const nullNote = container.querySelector('[data-null-note="' + field + '"]');
    if (nullNote) nullNote.style.display = btn.dataset.mode === "null" ? "block" : "none";
  });
}

/**
 * Собирает patch из сегментов.
 *  - skip  → поле не передаётся
 *  - null  → поле = null
 *  - иначе → либо значение из связанного input, либо (если input нет, как у completed)
 *            само значение mode.
 */
function collectPatch(container) {
  const out = {};
  $$(".segmented", container).forEach(seg => {
    const field = seg.dataset.field;
    const mode = seg.dataset.mode;
    if (mode === "skip") return;
    if (mode === "null") { out[field] = null; return; }

    const input = container.querySelector('[data-input="' + field + '"]');
    if (!input) { out[field] = mode; return; }

    const v = input.value.trim();
    if (v === "") { input.classList.add("error"); throw new Error("Заполните поле «" + field + "»"); }
    out[field] = v;
  });
  return out;
}

/* ============================================================
   5. API-клиент (реальный)
   ============================================================ */
async function realRequest(method, path, body) {
  const res = await fetch(API_BASE + path, {
    method: method,
    headers: body !== undefined && body !== null ? { "Content-Type": "application/json" } : undefined,
    body: body !== undefined && body !== null ? JSON.stringify(body) : undefined
  });
  if (res.status === 204) return null;
  const text = await res.text();
  let data = null;
  if (text) { try { data = JSON.parse(text); } catch (_) { data = text; } }
  if (!res.ok) {
    const msg = (data && (data.message || data.error)) || ("Ошибка " + res.status);
    throw new Error(msg);
  }
  return data;
}

   6. Демо-клиент (in-memory)

const mockDB = {

  ],

  nextTaskId: 5
};

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

async function mockRequest(method, path, body) {
  await sleep(180 + Math.random() * 220);
  const [pathname, query] = path.split("?");
  const params = new URLSearchParams(query || "");

  if (pathname === "/users" && method === "GET") {
    const offset = +(params.get("offset") || 0);
    const limit  = params.get("limit") ? +params.get("limit") : mockDB.users.length;
    return mockDB.users.slice(offset, offset + limit).map(u => ({ ...u }));
  }
  if (pathname === "/users" && method === "POST") {
    if (!body || !body.username || !String(body.username).trim())
      throw new Error("Поле «username» обязательно");
    const u = {
      id: mockDB.nextUserId++,
      username: String(body.username).trim(),
      phone_number: body.phone_number ? String(body.phone_number) : null,
      version: 1
    };
    mockDB.users.push(u);
    return { ...u };
  }
  let m = pathname.match(/^\/users\/(\d+)$/);
  if (m) {
    const id = +m[1];
    const idx = mockDB.users.findIndex(u => u.id === id);
    if (idx === -1) throw new Error("Пользователь не найден");
    if (method === "GET") return { ...mockDB.users[idx] };
    if (method === "PATCH") {
      const u = mockDB.users[idx];
      if (Object.prototype.hasOwnProperty.call(body, "username")) {
        if (body.username == null) throw new Error("username не может быть null");
        u.username = String(body.username);
      }
      if (Object.prototype.hasOwnProperty.call(body, "phone_number")) {
        u.phone_number = body.phone_number == null ? null : String(body.phone_number);
      }
      u.version++;
      return { ...u };
    }
    if (method === "DELETE") { mockDB.users.splice(idx, 1); return null; }
  }

  if (pathname === "/tasks" && method === "GET") {
    let items = mockDB.tasks.slice();
    const uid = params.get("user_id");
    if (uid) items = items.filter(t => t.author_user_id === +uid);
    const offset = +(params.get("offset") || 0);
    const limit  = params.get("limit") ? +params.get("limit") : items.length;
    return items.slice(offset, offset + limit).map(t => ({ ...t }));
  }
  if (pathname === "/tasks" && method === "POST") {
    if (!body || !String(body.title || "").trim()) throw new Error("Поле «title» обязательно");
    if (!body.author_user_id) throw new Error("Укажите автора задачи");
    if (!mockDB.users.some(u => u.id === +body.author_user_id))
      throw new Error("Автор с таким ID не найден");
    const t = {
      id: mockDB.nextTaskId++,
      title: String(body.title).trim(),
      description: body.description ? String(body.description) : null,
      completed: false,
      completed_at: null,
      created_at: new Date().toISOString(),
      author_user_id: +body.author_user_id,
      version: 1
    };
    mockDB.tasks.push(t);
    return { ...t };
  }
  m = pathname.match(/^\/tasks\/(\d+)$/);
  if (m) {
    const id = +m[1];
    const idx = mockDB.tasks.findIndex(t => t.id === id);
    if (idx === -1) throw new Error("Задача не найдена");
    if (method === "GET") return { ...mockDB.tasks[idx] };
    if (method === "PATCH") {
      const t = mockDB.tasks[idx];
      if (Object.prototype.hasOwnProperty.call(body, "title")) {
        if (body.title == null) throw new Error("title не может быть null");
        t.title = String(body.title);
      }
      if (Object.prototype.hasOwnProperty.call(body, "description")) {
        t.description = body.description == null ? null : String(body.description);
      }
      if (Object.prototype.hasOwnProperty.call(body, "completed")) {
        const nowCompleted = !!body.completed;
        if (nowCompleted !== t.completed) {
          t.completed = nowCompleted;
          t.completed_at = nowCompleted ? new Date().toISOString() : null;
        }
      }
      t.version++;
      return { ...t };
    }
    if (method === "DELETE") { mockDB.tasks.splice(idx, 1); return null; }
  }

  if (pathname === "/statistics" && method === "GET") {
    const uid = params.get("user_id");
    const from = params.get("from");
    const to = params.get("to");
    let items = mockDB.tasks.slice();
    if (uid) items = items.filter(t => t.author_user_id === +uid);
    if (from) items = items.filter(t => new Date(t.created_at) >= new Date(from + "T00:00:00Z"));
    if (to)   items = items.filter(t => new Date(t.created_at) <  new Date(to   + "T00:00:00Z"));

    const created = items.length;
    const completedItems = items.filter(t => t.completed);
    const completed = completedItems.length;

    let avgMs = 0;
    if (completedItems.length) {
      let total = 0, n = 0;
      completedItems.forEach(t => {
        if (t.completed_at && t.created_at) {
          const d = new Date(t.completed_at) - new Date(t.created_at);
          if (d > 0) { total += d; n++; }
        }
      });
      avgMs = n ? total / n : 0;
    }
    const avgSec = Math.round(avgMs / 1000);
    const h = Math.floor(avgSec / 3600), mi = Math.floor((avgSec % 3600) / 60), se = avgSec % 60;
    let durStr = "";
    if (h) durStr += h + "h";
    if (mi) durStr += mi + "m";
    durStr += se + "s";

    return {
      tasks_created: created,
      tasks_completed: completed,
      tasks_completed_rate: created ? +((completed / created) * 100).toFixed(1) : 0,
      tasks_average_completion_time: durStr
    };
  }

  throw new Error("Неизвестный запрос: " + method + " " + pathname);
}

const state = { demo: false };
async function request(method, path, body) {
  if (state.demo) return mockRequest(method, path, body);
  return realRequest(method, path, body);
}

async function checkConnection() {
  if (state.demo) {
    setConn("demo", "Демо-режим — данные локальные");
    return;
  }
  setConn("", "Проверка соединения…");
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 4000);
    const res = await fetch(API_BASE + "/users?limit=1", { signal: controller.signal });
    clearTimeout(timer);
    if (res.ok) {
      setConn("online", "API доступен · " + API_BASE.replace(/^https?:\/\//, ""));
    } else {
      setConn("offline", "API ответил с ошибкой " + res.status);
    }
  } catch (e) {
    setConn("offline", "Нет соединения с API");
  }
}

        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
        "Новая задача" +
      "</button>" +
    "</div>" +

    '<div class="toolbar">' +
      '<div class="search-wrap">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
        '<input class="input" type="search" id="task-search" placeholder="Поиск по названию или описанию…">' +
      "</div>" +
      '<span class="filter-label">Автор:</span>' +
      '<select class="select" id="task-user-filter" style="width:auto;min-width:180px">' +
        '<option value="">Все пользователи</option>' +
      "</select>" +
      '<button class="btn" id="task-refresh" type="button">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>' +
        "Обновить" +
      "</button>" +
    "</div>" +

    '<div id="tasks-body"></div>';

  $("#task-create").addEventListener("click", openCreateTaskModal);
  $("#task-refresh").addEventListener("click", () => loadTasks(true));

  const searchInput = $("#task-search");
  searchInput.addEventListener("input", debounce(() => {
    tasksState.search = searchInput.value.trim().toLowerCase();
    renderTaskList();
  }, 180));

  const userFilter = $("#task-user-filter");
  userFilter.addEventListener("change", () => {
    tasksState.userFilter = userFilter.value;
    tasksState.offset = 0;
    loadTasks();
  });

  loadUsersForSelect().then(() => {
    if (tasksState.usersCache) {
      userFilter.innerHTML = '<option value="">Все пользователи</option>' +
        tasksState.usersCache.map(u =>
          '<option value="' + u.id + '">' + esc(u.username) + " (#" + u.id + ")</option>"
        ).join("");
      userFilter.value = tasksState.userFilter;
    }
  });

  await loadTasks();
}

async function loadUsersForSelect(force) {
  if (tasksState.usersCache && !force) return tasksState.usersCache;
  try {
    tasksState.usersCache = await request("GET", "/users?limit=100");
  } catch (_) {
    tasksState.usersCache = [];
  }
  return tasksState.usersCache;
}

async function loadTasks(showSpinner) {
  const body = $("#tasks-body");
  if (!body) return;
  tasksState.loading = true;
  tasksState.error = null;
  if (showSpinner !== false) body.innerHTML = loadingBox("Загружаем задачи…");

  try {
    const qs = new URLSearchParams();
    if (tasksState.userFilter) qs.set("user_id", tasksState.userFilter);
    qs.set("limit", String(tasksState.limit));
    qs.set("offset", String(tasksState.offset));

    const items = await request("GET", "/tasks?" + qs.toString());
    tasksState.items = Array.isArray(items) ? items : [];
    tasksState.hasNext = tasksState.items.length === tasksState.limit;
    tasksState.loading = false;
    renderTaskList();
  } catch (e) {
    tasksState.loading = false;
    tasksState.error = e.message || "Ошибка загрузки";
    body.innerHTML = errorState(tasksState.error, "tasks-retry");
    const r = $("#tasks-retry");
    if (r) r.addEventListener("click", () => loadTasks());
  }
}

function renderTaskList() {
  const body = $("#tasks-body");
  if (!body) return;

  const q = tasksState.search;
  const items = q
    ? tasksState.items.filter(t =>
        (t.title || "").toLowerCase().includes(q) ||
        (t.description || "").toLowerCase().includes(q))
    : tasksState.items;

  if (!items.length) {
    const isFiltered = !!q || !!tasksState.userFilter;
    body.innerHTML = emptyState(
      ICONS.tasks,
      isFiltered ? "Ничего не найдено" : "Задач пока нет",
      isFiltered
        ? "Попробуйте изменить условия поиска или фильтр."
        : "Создайте первую задачу — и она появится здесь.",
      isFiltered
        ? '<button class="btn" id="task-clear-filters" type="button">Сбросить фильтры</button>'
        : '<button class="btn btn-primary" id="task-empty-create" type="button">Создать задачу</button>'
    );
    const clear = $("#task-clear-filters");
    if (clear) clear.addEventListener("click", () => {
      tasksState.search = "";
      tasksState.userFilter = "";
      tasksState.offset = 0;
      const s = $("#task-search"); if (s) s.value = "";
      const uf = $("#task-user-filter"); if (uf) uf.value = "";
      loadTasks();
    });
    const create = $("#task-empty-create");
    if (create) create.addEventListener("click", openCreateTaskModal);
    return;
  }

  const userMap = {};
  (tasksState.usersCache || []).forEach(u => { userMap[u.id] = u; });

  let html = '<div class="list">';
  items.forEach(t => {
    const author = userMap[t.author_user_id];
    const authorLabel = author
      ? author.username
      : "Пользователь #" + t.author_user_id;

    html +=
      '<div class="card task-card' + (t.completed ? " done" : "") + '">' +
        '<button class="check' + (t.completed ? " done" : "") + '" type="button" ' +
                'data-toggle="' + t.id + '" title="' +
                (t.completed ? "Вернуть в работу" : "Отметить выполненной") + '">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
        "</button>" +

        '<div class="task-main">' +
          '<div class="task-title">' + esc(t.title) + "</div>" +
          (t.description
            ? '<div class="task-desc">' + esc(t.description) + "</div>"
            : "") +
          '<div class="task-meta">' +
            '<span class="tag">' +
              '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' +
              esc(authorLabel) +
            "</span>" +
            "<span>Создана: " + esc(fmtDate(t.created_at)) + "</span>" +
            (t.completed_at && t.completed_at !== "null"
              ? "<span>Выполнена: " + esc(fmtDate(t.completed_at)) + "</span>"
              : "") +
          "</div>" +
        "</div>" +

        '<div class="task-actions">' +
          '<button class="btn btn-ghost" data-edit="' + t.id + '" title="Редактировать" type="button">' +
            '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
          "</button>" +
          '<button class="btn btn-ghost" data-del="' + t.id + '" title="Удалить" type="button">' +
            '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>' +
          "</button>" +
        "</div>" +
      "</div>";
  });
  html += "</div>";

  html += '<div class="pagination">' +
    '<div class="info">Показано ' + items.length + " " +
      plural(items.length, "задача", "задачи", "задач") +
      " · страница " + (Math.floor(tasksState.offset / tasksState.limit) + 1) +
    "</div>" +
    '<div class="controls">' +
      '<select class="page-size" id="task-limit">' +
        [5, 10, 20, 50].map(n =>
          '<option value="' + n + '"' + (n === tasksState.limit ? " selected" : "") + ">" + n + " на странице</option>"
        ).join("") +
      "</select>" +
      '<button class="btn btn-sm" id="task-prev" type="button"' +
        (tasksState.offset === 0 ? " disabled" : "") + ">Назад</button>" +
      '<button class="btn btn-sm" id="task-next" type="button"' +
        (!tasksState.hasNext ? " disabled" : "") + ">Вперёд</button>" +
    "</div>" +
  "</div>";

  body.innerHTML = html;

  $$("[data-toggle]", body).forEach(btn => {
    btn.addEventListener("click", () => toggleTaskCompleted(+btn.dataset.toggle));
  });
  $$("[data-edit]", body).forEach(btn => {
    btn.addEventListener("click", () => openEditTaskModal(+btn.dataset.edit));
  });
  $$("[data-del]", body).forEach(btn => {
    btn.addEventListener("click", () => deleteTask(+btn.dataset.del));
  });

  const limitSel = $("#task-limit");
  limitSel.addEventListener("change", () => {
    tasksState.limit = +limitSel.value;
    tasksState.offset = 0;
    loadTasks();
  });
  $("#task-prev").addEventListener("click", () => {
    tasksState.offset = Math.max(0, tasksState.offset - tasksState.limit);
    loadTasks();
  });
  $("#task-next").addEventListener("click", () => {
    if (!tasksState.hasNext) return;
    tasksState.offset += tasksState.limit;
    loadTasks();
  });
}

async function toggleTaskCompleted(id) {
  const t = tasksState.items.find(x => x.id === id);
  if (!t) return;
  try {
    await request("PATCH", "/tasks/" + id, { completed: !t.completed });
    toast(t.completed ? "Задача возвращена в работу" : "Задача выполнена", "success");
    await loadTasks(false);
  } catch (e) {
    toast("Не удалось обновить: " + e.message, "error");
  }
}

function deleteTask(id) {
  const t = tasksState.items.find(x => x.id === id);
  confirmDialog(
    "Удалить задачу?",
    t ? 'Задача «' + t.title + '» будет удалена безвозвратно.' : "Задача будет удалена безвозвратно.",
    "Удалить",
    async () => {
      try {
        await request("DELETE", "/tasks/" + id);
        toast("Задача удалена", "success");
        await loadTasks(false);
      } catch (e) {
        toast("Не удалось удалить: " + e.message, "error");
      }
    }
  );
}

async function openCreateTaskModal() {
  await loadUsersForSelect();
  const users = tasksState.usersCache || [];

  const usersOptions = users.length
    ? users.map(u => '<option value="' + u.id + '">' + esc(u.username) + " (#" + u.id + ")</option>").join("")
    : "";

  openModal({
    title: "Новая задача",
    subtitle: "Заполните поля и нажмите «Создать»",
    bodyHTML:
      '<div class="form-error" id="form-error"></div>' +
      '<div class="field">' +
        "<label>Название <span style=\"color:var(--danger)\">*</span></label>" +
        '<input class="input" data-input="title" maxlength="100" placeholder="Например: Погулять с собакой">' +
        '<div class="hint">От 1 до 100 символов</div>' +
      "</div>" +
      '<div class="field">' +
        "<label>Описание</label>" +
        '<textarea class="textarea" data-input="description" maxlength="1000" placeholder="Необязательно, до 1000 символов"></textarea>' +
      "</div>" +
      '<div class="field">' +
        "<label>Автор <span style=\"color:var(--danger)\">*</span></label>" +
        (users.length
          ? '<select class="select" data-input="author_user_id">' + usersOptions + "</select>"
          : '<input class="input" data-input="author_user_id" type="number" min="1" placeholder="ID пользователя">') +
        (users.length
          ? ""
          : '<div class="hint">Список пользователей недоступен — введите ID вручную</div>') +
      "</div>",
    footHTML:
      '<button class="btn" data-act="cancel" type="button">Отмена</button>' +
      '<button class="btn btn-primary" data-act="save" type="button">Создать</button>',
    onMount: (el, close) => {
      $('[data-act="cancel"]', el).addEventListener("click", close);
      const saveBtn = $('[data-act="save"]', el);
      const errBox = $("#form-error", el);

      $('[data-input="title"]', el).focus();

      saveBtn.addEventListener("click", async () => {
        errBox.classList.remove("show");
        const title = $('[data-input="title"]', el).value.trim();
        const description = $('[data-input="description"]', el).value.trim();
        const authorRaw = $('[data-input="author_user_id"]', el).value;

        if (!title) {
          errBox.textContent = "Введите название задачи.";
          errBox.classList.add("show");
          return;
        }
        if (!authorRaw) {
          errBox.textContent = "Укажите автора задачи.";
          errBox.classList.add("show");
          return;
        }

        const body = { title: title, author_user_id: +authorRaw };
        if (description) body.description = description;

        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="spinner"></span> Создание…';
        try {
          await request("POST", "/tasks", body);
          close();
          toast("Задача создана", "success");
          tasksState.offset = 0;
          await loadTasks(false);
        } catch (e) {
          errBox.textContent = e.message || "Не удалось создать задачу";
          errBox.classList.add("show");
          saveBtn.disabled = false;
          saveBtn.textContent = "Создать";
        }
      });
    }
  });
}

function openEditTaskModal(id) {
  const t = tasksState.items.find(x => x.id === id);
  if (!t) return;

  openModal({
    title: "Редактировать задачу",
    subtitle: t.title,
    bodyHTML:
      '<div class="form-error" id="form-error"></div>' +

      '<div class="field">' +
        "<label>Название</label>" +
        segmentedHTML("title", [
          { value: "skip", label: "Не менять" },
          { value: "set",  label: "Изменить" }
        ], "skip") +
        '<input class="input" data-input="title" value="' + esc(t.title) + '" maxlength="100" disabled>' +
      "</div>" +

      '<div class="field">' +
        "<label>Описание</label>" +
        segmentedHTML("description", [
          { value: "skip", label: "Не менять" },
          { value: "set",  label: "Изменить" },
          { value: "null", label: "Очистить" }
        ], "skip") +
        '<textarea class="textarea" data-input="description" maxlength="1000" disabled>' +
          esc(t.description || "") +
        "</textarea>" +
        '<div class="hint" data-null-note="description" style="display:none">Описание будет очищено</div>' +
      "</div>" +

      '<div class="field">' +
        "<label>Статус</label>" +
        segmentedHTML("completed", [
          { value: "skip",  label: "Не менять" },
          { value: "true",  label: "Выполнена" },
          { value: "false", label: "В работе" }
        ], "skip") +
        '<div class="hint">Текущий статус: ' + (t.completed ? "выполнена" : "в работе") + "</div>" +
      "</div>",
    footHTML:
      '<button class="btn" data-act="cancel" type="button">Отмена</button>' +
      '<button class="btn btn-primary" data-act="save" type="button">Сохранить</button>',
    onMount: (el, close) => {
      bindSegmented(el);
      $('[data-act="cancel"]', el).addEventListener("click", close);

      const saveBtn = $('[data-act="save"]', el);
      const errBox = $("#form-error", el);

      saveBtn.addEventListener("click", async () => {
        errBox.classList.remove("show");
        let body;
        try {
          body = collectPatch(el);
        } catch (e) {
          errBox.textContent = e.message;
          errBox.classList.add("show");
          return;
        }
        if (body.completed === "true") body.completed = true;
        else if (body.completed === "false") body.completed = false;

        if (Object.keys(body).length === 0) {
          close();
          return;
        }

        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="spinner"></span> Сохранение…';
        try {
          await request("PATCH", "/tasks/" + id, body);
          close();
          toast("Задача обновлена", "success");
          await loadTasks(false);
        } catch (e) {
          errBox.textContent = e.message || "Не удалось сохранить";
          errBox.classList.add("show");
          saveBtn.disabled = false;
          saveBtn.textContent = "Сохранить";
        }
      });
    }
  });
}

    '<div class="info">Показано ' + items.length + " " +
      plural(items.length, "пользователь", "пользователя", "пользователей") +
      " · страница " + (Math.floor(usersState.offset / usersState.limit) + 1) +
    "</div>" +
    '<div class="controls">' +
      '<select class="page-size" id="user-limit">' +
        [5, 10, 20, 50].map(n =>
          '<option value="' + n + '"' + (n === usersState.limit ? " selected" : "") + ">" + n + " на странице</option>"
        ).join("") +
      "</select>" +
      '<button class="btn btn-sm" id="user-prev" type="button"' +
        (usersState.offset === 0 ? " disabled" : "") + ">Назад</button>" +
      '<button class="btn btn-sm" id="user-next" type="button"' +
        (!usersState.hasNext ? " disabled" : "") + ">Вперёд</button>" +
    "</div>" +
  "</div>";

  body.innerHTML = html;

  $$("[data-edit]", body).forEach(btn =>
    btn.addEventListener("click", () => openEditUserModal(+btn.dataset.edit)));
  $$("[data-del]", body).forEach(btn =>
    btn.addEventListener("click", () => deleteUser(+btn.dataset.del)));

  $("#user-limit").addEventListener("change", (e) => {
    usersState.limit = +e.target.value;
    usersState.offset = 0;
    loadUsers();
  });
  $("#user-prev").addEventListener("click", () => {
    usersState.offset = Math.max(0, usersState.offset - usersState.limit);
    loadUsers();
  });
  $("#user-next").addEventListener("click", () => {
    if (!usersState.hasNext) return;
    usersState.offset += usersState.limit;
    loadUsers();
  });
}

function deleteUser(id) {
  const u = usersState.items.find(x => x.id === id);
  confirmDialog(
    "Удалить пользователя?",
    u ? 'Пользователь «' + u.username + '» будет удалён. Задачи, созданные им, могут остаться в системе.' : "Пользователь будет удалён.",
    "Удалить",
    async () => {
      try {
        await request("DELETE", "/users/" + id);
        toast("Пользователь удалён", "success");
        await loadUsers();
      } catch (e) {
        toast("Не удалось удалить: " + e.message, "error");
      }
    }
  );
}

function openCreateUserModal() {
  openModal({
    title: "Новый пользователь",
    subtitle: "Укажите имя и, при желании, телефон",
    bodyHTML:
      '<div class="form-error" id="form-error"></div>' +
      '<div class="field">' +
        "<label>Имя <span style=\"color:var(--danger)\">*</span></label>" +
        '<input class="input" data-input="username" maxlength="100" placeholder="Например: Иван Иванов">' +
        '<div class="hint">От 3 до 100 символов</div>' +
      "</div>" +
      '<div class="field">' +
        "<label>Телефон</label>" +
        '<input class="input" data-input="phone_number" maxlength="15" placeholder="+79998886655">' +
        '<div class="hint">От 10 до 15 символов, необязательно</div>' +
      "</div>",
    footHTML:
      '<button class="btn" data-act="cancel" type="button">Отмена</button>' +
      '<button class="btn btn-primary" data-act="save" type="button">Создать</button>',
    onMount: (el, close) => {
      $('[data-input="username"]', el).focus();
      $('[data-act="cancel"]', el).addEventListener("click", close);

      const saveBtn = $('[data-act="save"]', el);
      const errBox = $("#form-error", el);

      saveBtn.addEventListener("click", async () => {
        errBox.classList.remove("show");
        const username = $('[data-input="username"]', el).value.trim();
        const phone = $('[data-input="phone_number"]', el).value.trim();

        if (username.length < 3) {
          errBox.textContent = "Имя должно содержать не менее 3 символов.";
          errBox.classList.add("show");
          return;
        }
        if (phone && (phone.length < 10 || phone.length > 15)) {
          errBox.textContent = "Телефон должен содержать от 10 до 15 символов.";
          errBox.classList.add("show");
          return;
        }

        const body = { username: username };
        if (phone) body.phone_number = phone;

        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="spinner"></span> Создание…';
        try {
          await request("POST", "/users", body);
          close();
          toast("Пользователь создан", "success");
          usersState.offset = 0;
          tasksState.usersCache = null;
          await loadUsers();
        } catch (e) {
          errBox.textContent = e.message || "Не удалось создать пользователя";
          errBox.classList.add("show");
          saveBtn.disabled = false;
          saveBtn.textContent = "Создать";
        }
      });
    }
  });
}

function openEditUserModal(id) {
  const u = usersState.items.find(x => x.id === id);
  if (!u) return;

  openModal({
    title: "Редактировать пользователя",
    subtitle: u.username + " (#" + u.id + ")",
    bodyHTML:
      '<div class="form-error" id="form-error"></div>' +

      '<div class="field">' +
        "<label>Имя</label>" +
        segmentedHTML("username", [
          { value: "skip", label: "Не менять" },
          { value: "set",  label: "Изменить" }
        ], "skip") +
        '<input class="input" data-input="username" value="' + esc(u.username) + '" maxlength="100" disabled>' +
        '<div class="hint">Имя не может быть очищено</div>' +
      "</div>" +

      '<div class="field">' +
        "<label>Телефон</label>" +
        segmentedHTML("phone_number", [
          { value: "skip", label: "Не менять" },
          { value: "set",  label: "Изменить" },
          { value: "null", label: "Очистить" }
        ], "skip") +
        '<input class="input" data-input="phone_number" value="' + esc(u.phone_number || "") + '" maxlength="15" disabled>' +
        '<div class="hint" data-null-note="phone_number" style="display:none">Телефон будет удалён</div>' +
      "</div>",
    footHTML:
      '<button class="btn" data-act="cancel" type="button">Отмена</button>' +
      '<button class="btn btn-primary" data-act="save" type="button">Сохранить</button>',
    onMount: (el, close) => {
      bindSegmented(el);
      $('[data-act="cancel"]', el).addEventListener("click", close);

      const saveBtn = $('[data-act="save"]', el);
      const errBox = $("#form-error", el);

      saveBtn.addEventListener("click", async () => {
        errBox.classList.remove("show");
        let body;
        try {
          body = collectPatch(el);
        } catch (e) {
          errBox.textContent = e.message;
          errBox.classList.add("show");
          return;
        }
        if (Object.keys(body).length === 0) { close(); return; }

        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="spinner"></span> Сохранение…';
        try {
          await request("PATCH", "/users/" + id, body);
          close();
          toast("Пользователь обновлён", "success");
          tasksState.usersCache = null;
          await loadUsers();
        } catch (e) {
          errBox.textContent = e.message || "Не удалось сохранить";
          errBox.classList.add("show");
          saveBtn.disabled = false;
          saveBtn.textContent = "Сохранить";
        }
      });
    }
  });
}

/* ============================================================
   11. Просмотр: Статистика
   ============================================================ */
const statsState = { data: null, loading: false, error: null,
                     userId: "", from: "", to: "" };

async function renderStatsView() {
  view.innerHTML =
    '<div class="view-head">' +
      "<div>" +
        "<h1>Статистика</h1>" +
        "<p>Сводные показатели по задачам за выбранный период</p>" +
      "</div>" +
    "</div>" +

    '<div class="toolbar">' +
      '<span class="filter-label">Пользователь:</span>' +
      '<select class="select" id="stats-user" style="width:auto;min-width:180px">' +
        '<option value="">Все пользователи</option>' +
      "</select>" +
      '<span class="filter-label">С</span>' +
      '<input class="input" type="date" id="stats-from" style="width:auto">' +
      '<span class="filter-label">по</span>' +
      '<input class="input" type="date" id="stats-to" style="width:auto">' +
      '<button class="btn btn-primary" id="stats-apply" type="button">Показать</button>' +
      '<button class="btn" id="stats-reset" type="button">Сбросить</button>' +
    "</div>" +

    '<div id="stats-body"></div>';

  await loadUsersForSelect();
  const userSel = $("#stats-user");
  if (tasksState.usersCache && tasksState.usersCache.length) {
    userSel.innerHTML = '<option value="">Все пользователи</option>' +
      tasksState.usersCache.map(u =>
        '<option value="' + u.id + '">' + esc(u.username) + " (#" + u.id + ")</option>"
      ).join("");
  }

  $("#stats-apply").addEventListener("click", loadStats);
  $("#stats-reset").addEventListener("click", () => {
    $("#stats-user").value = "";
    $("#stats-from").value = "";
    $("#stats-to").value = "";
    statsState.userId = "";
    statsState.from = "";
    statsState.to = "";
    loadStats();
  });

  await loadStats();
}

async function loadStats() {
  const body = $("#stats-body");
  if (!body) return;

  statsState.userId = $("#stats-user").value;
  statsState.from = $("#stats-from").value;
  statsState.to = $("#stats-to").value;

  statsState.loading = true;
  statsState.error = null;
  body.innerHTML = loadingBox("Считаем статистику…");

  try {
    const qs = new URLSearchParams();
    if (statsState.userId) qs.set("user_id", statsState.userId);
    if (statsState.from) qs.set("from", statsState.from);
    if (statsState.to) qs.set("to", statsState.to);
    const path = "/statistics" + (qs.toString() ? "?" + qs.toString() : "");
    const data = await request("GET", path);
    statsState.data = data || {};
    statsState.loading = false;
    renderStats();
  } catch (e) {
    statsState.loading = false;
    statsState.error = e.message || "Ошибка загрузки";
    body.innerHTML = errorState(statsState.error, "stats-retry");
    const r = $("#stats-retry");
    if (r) r.addEventListener("click", loadStats);
  }
}

function renderStats() {
  const body = $("#stats-body");
  if (!body) return;
  const d = statsState.data || {};

  const created = Number(d.tasks_created || 0);
  const completed = Number(d.tasks_completed || 0);
  const rate = Number(d.tasks_completed_rate || 0);
  const avg = d.tasks_average_completion_time;

  const period = (statsState.from || statsState.to)
    ? "Период: " +
      (statsState.from ? "с " + statsState.from : "с начала") +
      (statsState.to ? " по " + statsState.to : " по настоящее время")
    : "За всё время";

  /* Кольцо: viewBox 36×36, r=14, stroke-width=7 → макс. 14+3.5=17.5 < 18 — не обрезается */
  const ringR = 14;
  const circ = 2 * Math.PI * ringR;
  const dash = (Math.max(0, Math.min(100, rate)) / 100) * circ;

  body.innerHTML =
    '<div class="stat-card" style="margin-bottom:16px">' +
      '<div class="stat-label">' + esc(period) + "</div>" +
      '<div class="stat-value">' + created + ' <small>' +
        plural(created, "задача", "задачи", "задач") + " создано</small></div>" +
    "</div>" +

    '<div class="stats-grid">' +

      '<div class="stat-card">' +
        '<div class="stat-icon i-created">' +
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
        "</div>" +
        '<div class="stat-label">Создано задач</div>' +
        '<div class="stat-value">' + created + "</div>" +
        '<div class="stat-sub">за выбранный период</div>' +
      "</div>" +

      '<div class="stat-card">' +
        '<div class="stat-icon i-done">' +
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
        "</div>" +
        '<div class="stat-label">Выполнено задач</div>' +
        '<div class="stat-value">' + completed + "</div>" +
        '<div class="stat-sub">отмечено как выполненные</div>' +
      "</div>" +

      '<div class="stat-card">' +
        '<div class="stat-label" style="margin-bottom:12px">Доля выполненных</div>' +
        '<div class="ring-wrap">' +
          '<svg class="ring" viewBox="0 0 36 36">' +
            '<circle class="bg" cx="18" cy="18" r="' + ringR + '"/>' +
            '<circle class="fg" cx="18" cy="18" r="' + ringR + '" ' +
              'stroke-dasharray="' + dash.toFixed(2) + " " + (circ - dash).toFixed(2) + '"/>' +
          "</svg>" +
          "<div>" +
            '<div class="stat-value">' + rate.toFixed(1).replace(/\.0$/, "") + '<small>%</small></div>' +
            '<div class="stat-sub">' + completed + " из " + created + "</div>" +
          "</div>" +
        "</div>" +
      "</div>" +

      '<div class="stat-card">' +
        '<div class="stat-icon i-time">' +
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
        "</div>" +
        '<div class="stat-label">Среднее время выполнения</div>' +
        '<div class="stat-value" style="font-size:22px">' + esc(fmtDuration(avg)) + "</div>" +
        '<div class="stat-sub">от создания до завершения</div>' +
      "</div>" +

    "</div>";
}

/* ============================================================
   12. Роутер
   ============================================================ */
function currentRoute() {
  const hash = location.hash.replace(/^#\/?/, "");
  const name = (hash.split("/")[0] || "tasks").toLowerCase();
  return ["tasks", "users", "statistics"].indexOf(name) !== -1 ? name : "tasks";
}

function setActiveNav(route) {
  $$(".nav-item").forEach(a => {
    a.classList.toggle("active", a.dataset.route === route);
  });
}

function render() {
  const route = currentRoute();
  setActiveNav(route);

  if (route === "tasks")       renderTasksView();
  else if (route === "users")  renderUsersView();
  else                         renderStatsView();
}

window.addEventListener("hashchange", render);

/* ============================================================
   13. Старт
   ============================================================ */
checkConnection();
render();

})();
</script>
</body>
</html>
